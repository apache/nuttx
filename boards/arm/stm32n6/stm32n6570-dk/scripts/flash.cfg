# Load interface/stlink.cfg and target/stm32n6x.cfg before this file.

reset_config srst_only srst_nogate
flash bank stm32n6570_dk.nor stmqspi 0x70000000 0 0 0 $_TARGETNAME 0x5802a000
proc stm32n6570_dk_flash_init {} {
    # Stop inherited interrupts and instruction caching while OpenOCD runs
    # SRAM algorithms.  The boot ROM also leaves stack limits set.

    mww 0xe000e010 0
    mww 0xe000ed04 0x0a000000
    mmw 0xe000ed14 0 0x20000
    mww 0xe000ef50 0
    reg msplim_s 0
    reg psplim_s 0
    reg primask_s 1

    # PWR, GPION and all XSPIM clocks.  Reset both XSPI controllers before
    # restoring the direct XSPI2-to-port-2 mapping left changed by ROM.

    mww 0x56028a5c 0x42000
    mww 0x56028a60 0x3020
    mww 0x56028a20 0x3020
    mww 0x56029220 0x3020

    # HCLK kernel source and conservative /8 prescaler.

    mmw 0x56028158 0 0x30

    # The DK NOR uses the 1.8 V VDDIO3 domain.

    mmw 0x5602483c 0x04000200 0

    # PN1 NCS, PN2 MOSI, PN3 MISO, PN6 CLK, AF9.

    mmw 0x56023400 0x20a8 0x30fc
    mmw 0x56023408 0x30fc 0
    mmw 0x5602340c 0x504 0x3ffc
    mmw 0x56023420 0x09009990 0x0f00fff0

    # Map XSPI2 to port 2 and configure single-lane, 32-bit-address reads.

    mww 0x5802b400 0
    mww 0x5802a008 0x001a0700
    mww 0x5802a00c 7
    mww 0x5802a108 0
    mww 0x5802a100 0x01003101
    mww 0x5802a110 0x13
    mww 0x5802a000 0x30000001

    # MX66UW1G45G geometry and standard 4-byte read/program/erase commands.
    # This part is absent from some OpenOCD JEDEC ID tables.

    stmqspi set stm32n6570_dk.nor MX66UW1G45G 0x8000000 256 \
        0x13 0 0x12 0x60 0x10000 0xdc
}

# Add the unauthenticated ROM header v2.3 (UM3234) as part of programming.
# The vector table follows the header and padding at offset 0x400.

proc stm32n6_program {image} {
    set input [open $image rb]
    set data [read $input]
    close $input

    # Jim Tcl strings can contain UTF-8; use the binary byte count.

    set size [string bytelength $data]
    if {$size < 8 || $size > 0x7fc00} {
        error "NuttX binary must contain vectors and fit in 511 KiB"
    }

    binary scan $data ii stack entry
    if {$stack < 0x34180400 || $stack > 0x34400000 || ($stack & 3)} {
        error "Initial SP must be word-aligned and inside AXISRAM"
    }
    if {!($entry & 1) || ($entry & ~1) < 0x34180400 ||
        ($entry & ~1) >= 0x34180400 + $size} {
        error "Reset vector must point into the payload at 0x34180400"
    }

    set checksum 0
    binary scan $data c* bytes
    foreach byte $bytes {
        set checksum [expr {($checksum + ($byte & 0xff)) & 0xffffffff}]
    }
    set padding [expr {(-$size) & 31}]
    set length [expr {0x1c0 + $size + $padding}]
    set header [lrepeat 256 0]
    foreach {offset value} [list \
        0x00 0x324d5453 \
        0x64 $checksum \
        0x68 0x00020300 \
        0x6c $length \
        0x70 $entry \
        0x78 0xffffffff \
        0x84 0x80000000 \
        0x88 0x1a0 \
        0x8c 0x10 \
        0xa0 0xffff5453 \
        0xa4 0x1a0] {
        lset header [expr {$offset / 4}] $value
    }

    set boot [file rootname $image]-boot.bin
    set output [open $boot wb]
    puts -nonewline $output [binary format i* $header]
    puts -nonewline $output $data
    puts -nonewline $output [binary format x$padding]
    close $output

    # Reject a truncated or incorrectly encoded image before touching flash.

    if {[file size $boot] != 0x400 + $size + $padding} {
        error "Boot image size does not match the ROM header"
    }

    # Keep the current debug access until the replacement image is verified.

    init
    halt
    stm32n6570_dk_flash_init
    echo [flash write_image erase $boot 0x70000000 bin]
    echo [verify_image $boot 0x70000000 bin]
    reset run
    shutdown
}
