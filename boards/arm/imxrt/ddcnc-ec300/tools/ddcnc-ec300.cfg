# OpenOCD configuration for the Digital Dream EC300 (i.MX RT1052) with an
# ST-Link (or any other HLA/SWD) debug probe.
#
# OpenOCD has no flash driver for the i.MX RT FlexSPI controller, so this
# file implements one in Tcl.  The QSPI NOR flash is accessed through
# FlexSPI IP commands using standard single-bit SPI NOR commands, so it does
# not depend on how the boot ROM or the running firmware configured the
# controller.
#
# Usage examples:
#
#   Backup the whole flash:
#     openocd -f ddcnc-ec300.cfg -c "init; ec300_flash_dump backup.bin; shutdown"
#
#   Program NuttX (raw binary, linked at 0x60000000) and reboot:
#     openocd -f ddcnc-ec300.cfg -c "init; ec300_program nuttx.bin; shutdown"
#
#   Other commands (run after "init"):
#     ec300_flash_info                     JEDEC ID and status registers
#     ec300_flash_erase <offset> <length>  Erase (rounded to 4 KiB sectors)
#     ec300_flash_write <file> [offset]    Program a raw binary file
#     ec300_flash_verify <file> [offset]   Compare flash with a binary file
#     ec300_flash_erase_all                Erase the whole 4 MiB flash
#
# Offsets are relative to the start of the flash (0x60000000).

if { [info exists INTERFACE] } {
	source [find interface/$INTERFACE.cfg]
} else {
	source [find interface/stlink.cfg]
}

transport select hla_swd
adapter speed 1800

source [find target/swj-dp.tcl]
source [find mem_helper.tcl]

set _CHIPNAME imxrt
set _TARGETNAME $_CHIPNAME.cpu

swj_newdap $_CHIPNAME cpu -irlen 4 -expected-id 0x0bd11477
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -endian little -dap $_CHIPNAME.dap

$_TARGETNAME configure -work-area-phys 0x20200000 \
                       -work-area-size 0x4000 \
                       -work-area-backup 0

# Flash geometry

set EC300_FLASH_BASE     0x60000000
set EC300_FLASH_SIZE     0x00400000
set EC300_PAGE_SIZE      256
set EC300_SECTOR_SIZE    0x1000
set EC300_BLOCK_SIZE     0x10000

# OCRAM buffer used to stage the image before programming

set EC300_BUF_ADDR       0x20200000
set EC300_BUF_SIZE       0x10000

# Registers

set FLEXSPI              0x402a8000
set FLEXSPI_MCR0         [expr {$FLEXSPI + 0x000}]
set FLEXSPI_MCR1         [expr {$FLEXSPI + 0x004}]
set FLEXSPI_MCR2         [expr {$FLEXSPI + 0x008}]
set FLEXSPI_AHBCR        [expr {$FLEXSPI + 0x00c}]
set FLEXSPI_INTR         [expr {$FLEXSPI + 0x014}]
set FLEXSPI_LUTKEY       [expr {$FLEXSPI + 0x018}]
set FLEXSPI_LUTCR        [expr {$FLEXSPI + 0x01c}]
set FLEXSPI_FLSHA1CR0    [expr {$FLEXSPI + 0x060}]
set FLEXSPI_FLSHA2CR0    [expr {$FLEXSPI + 0x064}]
set FLEXSPI_FLSHB1CR0    [expr {$FLEXSPI + 0x068}]
set FLEXSPI_FLSHB2CR0    [expr {$FLEXSPI + 0x06c}]
set FLEXSPI_FLSHCR1A1    [expr {$FLEXSPI + 0x070}]
set FLEXSPI_FLSHCR2A1    [expr {$FLEXSPI + 0x080}]
set FLEXSPI_IPCR0        [expr {$FLEXSPI + 0x0a0}]
set FLEXSPI_IPCMD        [expr {$FLEXSPI + 0x0b0}]
set FLEXSPI_IPRXFCR      [expr {$FLEXSPI + 0x0b8}]
set FLEXSPI_IPTXFCR      [expr {$FLEXSPI + 0x0bc}]
set FLEXSPI_DLLACR       [expr {$FLEXSPI + 0x0c0}]
set FLEXSPI_STS0         [expr {$FLEXSPI + 0x0e0}]
set FLEXSPI_STS1         [expr {$FLEXSPI + 0x0e4}]
set FLEXSPI_RFDR         [expr {$FLEXSPI + 0x100}]
set FLEXSPI_TFDR         [expr {$FLEXSPI + 0x180}]
set FLEXSPI_LUT          [expr {$FLEXSPI + 0x200}]

set CCM_CSCMR1           0x400fc01c
set CCM_CCGR6            0x400fc080
set CCM_ANALOG_PFD_528   0x400d8100

set IOMUXC_SW_MUX_SD_B1_05 0x401f81e8
set IOMUXC_SW_PAD_SD_B1_05 0x401f83d8

set WDOG1_WMCR           0x400b8008
set WDOG2_WMCR           0x400d0008
set RTWDOG_CS            0x400bc000
set RTWDOG_CNT           0x400bc004
set RTWDOG_TOVAL         0x400bc008

set SCB_CCR              0xe000ed14

# FlexSPI LUT sequences
#
# Each LUT instruction is (opcode << 10) | (pads << 8) | operand, and every
# sequence has four 32-bit words with two instructions each.  Sequences that
# need a write enable are preceded by a WREN sequence so both can be issued
# with a single IP command (ISEQNUM = 1).

set LUT_SEQ_READ         0   ;# 0x0b fast read, used for AHB (XIP) reads
set LUT_SEQ_RDSR         1   ;# 0x05 read status register 1
set LUT_SEQ_PP           2   ;# 0x06 + 0x02 page program
set LUT_SEQ_SE           4   ;# 0x06 + 0x20 4 KiB sector erase
set LUT_SEQ_BE           6   ;# 0x06 + 0xd8 64 KiB block erase
set LUT_SEQ_RDID         8   ;# 0x9f read JEDEC ID
set LUT_SEQ_RESET        9   ;# 0x66 + 0x99 software reset
set LUT_SEQ_RDSR2        11  ;# 0x35 read status register 2

proc _lut_instr {opcode pads operand} {
	return [expr {($opcode << 10) | ($pads << 8) | $operand}]
}

proc _lut_word {i0 {i1 0}} {
	return [expr {$i0 | ($i1 << 16)}]
}

proc _lut_cmd {cmd} {
	return [_lut_instr 0x01 0 $cmd]
}

# INTR flags cleared before and after an IP command: IPCMDDONE, IPCMDGE,
# AHBCMDGE, IPCMDERR, AHBCMDERR and SEQTIMEOUT.  IPRXWA and IPTXWE must not
# be written here: writing them pops/pushes the IP RX/TX FIFOs.

set FLEXSPI_INTR_CMD     0x81f

set LUT_ADDR24           [_lut_instr 0x02 0 24]
set LUT_DUMMY8           [_lut_instr 0x0c 0 8]
set LUT_READ             [_lut_instr 0x09 0 4]
set LUT_WRITE            [_lut_instr 0x08 0 4]

proc _flexspi_wait_idle {} {
	global FLEXSPI_STS0

	for {set i 0} {$i < 1000} {incr i} {
		if {([read_memory $FLEXSPI_STS0 32 1] & 0x3) == 0x3} {
			return
		}
	}

	error "FlexSPI: controller is not idle"
}

proc _flexspi_load_lut {} {
	global FLEXSPI_LUTKEY FLEXSPI_LUTCR FLEXSPI_LUT
	global LUT_ADDR24 LUT_DUMMY8 LUT_READ LUT_WRITE

	set seqs [dict create \
		0  [list [_lut_word [_lut_cmd 0x0b] $LUT_ADDR24] \
		         [_lut_word $LUT_DUMMY8 $LUT_READ] 0 0] \
		1  [list [_lut_word [_lut_cmd 0x05] $LUT_READ] 0 0 0] \
		2  [list [_lut_word [_lut_cmd 0x06]] 0 0 0] \
		3  [list [_lut_word [_lut_cmd 0x02] $LUT_ADDR24] \
		         [_lut_word $LUT_WRITE] 0 0] \
		4  [list [_lut_word [_lut_cmd 0x06]] 0 0 0] \
		5  [list [_lut_word [_lut_cmd 0x20] $LUT_ADDR24] 0 0 0] \
		6  [list [_lut_word [_lut_cmd 0x06]] 0 0 0] \
		7  [list [_lut_word [_lut_cmd 0xd8] $LUT_ADDR24] 0 0 0] \
		8  [list [_lut_word [_lut_cmd 0x9f] $LUT_READ] 0 0 0] \
		9  [list [_lut_word [_lut_cmd 0x66]] 0 0 0] \
		10 [list [_lut_word [_lut_cmd 0x99]] 0 0 0] \
		11 [list [_lut_word [_lut_cmd 0x35] $LUT_READ] 0 0 0]]

	# Unlock the LUT, write the sequences and lock it again

	mww $FLEXSPI_LUTKEY 0x5af05af0
	mww $FLEXSPI_LUTCR 0x2

	dict for {seq words} $seqs {
		write_memory [expr {$FLEXSPI_LUT + $seq * 16}] 32 $words
	}

	mww $FLEXSPI_LUTKEY 0x5af05af0
	mww $FLEXSPI_LUTCR 0x1
}

# Issue an IP command.  The data size is in bytes and nseq is the number of
# additional sequences to execute after the first one.

proc _flexspi_ip_start {seq addr {size 0} {nseq 0}} {
	global FLEXSPI_INTR FLEXSPI_INTR_CMD FLEXSPI_IPCR0 FLEXSPI_IPCMD

	mww $FLEXSPI_INTR $FLEXSPI_INTR_CMD
	write_memory $FLEXSPI_IPCR0 32 \
		[list $addr [expr {($nseq << 24) | ($seq << 16) | $size}]]
	mww $FLEXSPI_IPCMD 0x1
}

proc _flexspi_ip_wait {} {
	global FLEXSPI_INTR FLEXSPI_INTR_CMD FLEXSPI_STS1

	for {set i 0} {$i < 1000} {incr i} {
		set intr [read_memory $FLEXSPI_INTR 32 1]

		# IPCMDERR (bit 3) or SEQTIMEOUT (bit 11)

		if {$intr & 0x808} {
			set sts1 [read_memory $FLEXSPI_STS1 32 1]
			mww $FLEXSPI_INTR $FLEXSPI_INTR_CMD
			error [format "FlexSPI: IP command failed, INTR=0x%08x STS1=0x%08x" \
			       $intr $sts1]
		}

		# IPCMDDONE (bit 0)

		if {$intr & 0x1} {
			mww $FLEXSPI_INTR 0x1
			return
		}
	}

	error "FlexSPI: IP command timeout"
}

proc _flexspi_ip_cmd {seq {addr 0} {nseq 0}} {
	_flexspi_ip_start $seq $addr 0 $nseq
	_flexspi_ip_wait
}

# Execute a read sequence and return up to 8 bytes as a list of words

proc _flexspi_ip_read {seq size {addr 0}} {
	global FLEXSPI_IPRXFCR FLEXSPI_RFDR

	mww $FLEXSPI_IPRXFCR 0x1
	_flexspi_ip_start $seq $addr $size
	_flexspi_ip_wait

	set data [read_memory $FLEXSPI_RFDR 32 [expr {($size + 3) / 4}]]
	mww $FLEXSPI_IPRXFCR 0x1
	return $data
}

proc _nor_read_status {} {
	global LUT_SEQ_RDSR
	return [expr {[lindex [_flexspi_ip_read $LUT_SEQ_RDSR 1] 0] & 0xff}]
}

proc _nor_wait_ready {{timeout_ms 5000}} {
	set start [ms]
	while {[_nor_read_status] & 0x1} {
		if {[ms] - $start > $timeout_ms} {
			error "QSPI NOR: timeout waiting for the flash to be ready"
		}
	}
}

# Program one page (up to 256 bytes) from a list of 32-bit words

proc _nor_program_page {offset words} {
	global FLEXSPI_INTR FLEXSPI_IPTXFCR FLEXSPI_TFDR LUT_SEQ_PP

	set size [expr {[llength $words] * 4}]

	# Clear the TX FIFO and set the watermark to 128 bytes

	mww $FLEXSPI_IPTXFCR [expr {(15 << 2) | 0x1}]

	_flexspi_ip_start $LUT_SEQ_PP $offset $size 1

	for {set i 0} {$i < [llength $words]} {incr i 32} {
		for {set j 0} {$j < 1000} {incr j} {
			if {[read_memory $FLEXSPI_INTR 32 1] & 0x40} {
				break
			}
		}

		# Fill the FIFO and push the data with IPTXWE (bit 6)

		set chunk [lrange $words $i [expr {$i + 31}]]
		while {[llength $chunk] < 32} {
			lappend chunk 0xffffffff
		}

		write_memory $FLEXSPI_TFDR 32 $chunk
		mww $FLEXSPI_INTR 0x40
	}

	_flexspi_ip_wait
	_nor_wait_ready
}

proc _ec300_disable_watchdogs {} {
	global WDOG1_WMCR WDOG2_WMCR RTWDOG_CS RTWDOG_CNT RTWDOG_TOVAL

	# Disable the WDOG1/WDOG2 power down counters.  WDOG1/WDOG2 themselves
	# cannot be disabled once enabled.

	mwh $WDOG1_WMCR 0
	mwh $WDOG2_WMCR 0

	# Disable RTWDOG (WDOG3) if it is enabled and can be updated

	set cs [read_memory $RTWDOG_CS 32 1]
	if {($cs & 0x80) && ($cs & 0x20)} {
		mww $RTWDOG_CNT 0xd928c520
		mww $RTWDOG_TOVAL 0xffff
		mww $RTWDOG_CS [expr {($cs & ~0x80) | 0x20}]
	}
}

# Halt the CPU and configure FlexSPI for the programming commands

proc ec300_flash_init {} {
	global FLEXSPI_MCR0 FLEXSPI_MCR1 FLEXSPI_MCR2 FLEXSPI_AHBCR
	global FLEXSPI_FLSHA1CR0 FLEXSPI_FLSHA2CR0 FLEXSPI_FLSHB1CR0
	global FLEXSPI_FLSHB2CR0 FLEXSPI_FLSHCR1A1 FLEXSPI_FLSHCR2A1
	global FLEXSPI_DLLACR FLEXSPI_INTR FLEXSPI_INTR_CMD
	global CCM_CSCMR1 CCM_CCGR6 CCM_ANALOG_PFD_528
	global IOMUXC_SW_MUX_SD_B1_05 IOMUXC_SW_PAD_SD_B1_05
	global SCB_CCR LUT_SEQ_RESET EC300_FLASH_SIZE

	halt
	wait_halt 1000

	# The firmware may have enabled the caches.  Disable them so that debug
	# reads of the flash memory map see the new contents.  Nothing is
	# written back: the chip is reset after programming.

	mww $SCB_CCR [expr {[read_memory $SCB_CCR 32 1] & ~0x30000}]

	_ec300_disable_watchdogs

	# Disable FlexSPI before changing its clock

	_flexspi_wait_idle
	mww $FLEXSPI_MCR0 [expr {[read_memory $FLEXSPI_MCR0 32 1] | 0x2}]

	# FlexSPI clock: PLL2 PFD2 = 528 MHz * 18 / 35 = 271.5 MHz, divided by
	# 8 = 34 MHz.  The PFD is only used by SEMC/uSDHC, which the EC300
	# doesn't use, and it is reconfigured by the next boot anyway.

	mmw $CCM_CCGR6 0 [expr {0x3 << 10}]
	mmw $CCM_ANALOG_PFD_528 [expr {35 << 16}] [expr {0xbf << 16}]
	mmw $CCM_CSCMR1 [expr {(2 << 29) | (7 << 23)}] \
	                [expr {(3 << 29) | (7 << 23)}]
	mmw $CCM_CCGR6 [expr {0x3 << 10}] 0

	# FlexSPI pins: GPIO_SD_B1_05..11 in ALT1 with the boot ROM pad
	# settings.  DQS is not used (the read strobe is looped back
	# internally), but it is configured the same way the boot ROM does.

	for {set i 0} {$i < 7} {incr i} {
		mww [expr {$IOMUXC_SW_MUX_SD_B1_05 + $i * 4}] 0x1
		mww [expr {$IOMUXC_SW_PAD_SD_B1_05 + $i * 4}] 0x10f1
	}

	# Module configuration (still disabled): maximum grant wait, internal
	# dummy read strobe, single 4 MiB flash on port A1.

	mww $FLEXSPI_MCR0 0xffff0002
	mww $FLEXSPI_MCR1 0xffffffff
	mww $FLEXSPI_MCR2 0x200001f7
	mww $FLEXSPI_AHBCR 0x00000078
	mww $FLEXSPI_FLSHA1CR0 [expr {$EC300_FLASH_SIZE / 1024}]
	mww $FLEXSPI_FLSHA2CR0 0
	mww $FLEXSPI_FLSHB1CR0 0
	mww $FLEXSPI_FLSHB2CR0 0
	mww $FLEXSPI_FLSHCR1A1 0x00000063
	mww $FLEXSPI_FLSHCR2A1 0x00000000

	# The clock is below 100 MHz: bypass the DLL

	mww $FLEXSPI_DLLACR 0x00000100

	# Enable the module and perform a software reset

	mww $FLEXSPI_MCR0 0xffff0000
	mww $FLEXSPI_MCR0 0xffff0001
	for {set i 0} {$i < 1000} {incr i} {
		if {([read_memory $FLEXSPI_MCR0 32 1] & 0x1) == 0} {
			break
		}
	}

	mww $FLEXSPI_INTR $FLEXSPI_INTR_CMD
	_flexspi_load_lut

	# Reset the flash to make sure it is not in a continuous read mode

	_flexspi_ip_cmd $LUT_SEQ_RESET 0 1
	sleep 1
	_nor_wait_ready
}

proc _flexspi_flush_ahb {} {
	global FLEXSPI_MCR0

	# Software reset clears the AHB RX buffers, so AHB reads return the new
	# contents of the flash

	mww $FLEXSPI_MCR0 [expr {[read_memory $FLEXSPI_MCR0 32 1] | 0x1}]
	for {set i 0} {$i < 1000} {incr i} {
		if {([read_memory $FLEXSPI_MCR0 32 1] & 0x1) == 0} {
			return
		}
	}
}

proc ec300_flash_info {} {
	global LUT_SEQ_RDID LUT_SEQ_RDSR2

	ec300_flash_init

	set id [lindex [_flexspi_ip_read $LUT_SEQ_RDID 3] 0]
	set sr1 [_nor_read_status]
	set sr2 [expr {[lindex [_flexspi_ip_read $LUT_SEQ_RDSR2 1] 0] & 0xff}]

	echo [format "QSPI NOR: manufacturer 0x%02x, device 0x%02x%02x" \
	      [expr {$id & 0xff}] [expr {($id >> 8) & 0xff}] \
	      [expr {($id >> 16) & 0xff}]]
	echo [format "QSPI NOR: SR1 0x%02x, SR2 0x%02x" $sr1 $sr2]

	if {$sr1 & 0x7c} {
		echo "QSPI NOR: WARNING: block protection bits are set"
	}
}

proc _ec300_check_range {offset length} {
	global EC300_FLASH_SIZE

	if {$offset < 0 || $length <= 0 || \
	    $offset + $length > $EC300_FLASH_SIZE} {
		error [format "Invalid flash range 0x%x + 0x%x" $offset $length]
	}
}

proc _ec300_erase {offset length} {
	global EC300_SECTOR_SIZE EC300_BLOCK_SIZE LUT_SEQ_SE LUT_SEQ_BE

	_ec300_check_range $offset $length

	set end [expr {($offset + $length + $EC300_SECTOR_SIZE - 1) & \
	               ~($EC300_SECTOR_SIZE - 1)}]
	set addr [expr {$offset & ~($EC300_SECTOR_SIZE - 1)}]

	echo [format "Erasing 0x%06x..0x%06x" $addr [expr {$end - 1}]]

	while {$addr < $end} {
		if {($addr & ($EC300_BLOCK_SIZE - 1)) == 0 && \
		    $addr + $EC300_BLOCK_SIZE <= $end} {
			_flexspi_ip_cmd $LUT_SEQ_BE $addr 1
			incr addr $EC300_BLOCK_SIZE
		} else {
			_flexspi_ip_cmd $LUT_SEQ_SE $addr 1
			incr addr $EC300_SECTOR_SIZE
		}

		_nor_wait_ready
	}
}

proc ec300_flash_erase {offset length} {
	ec300_flash_init
	_ec300_erase $offset $length
	_flexspi_flush_ahb
}

proc ec300_flash_erase_all {} {
	global EC300_FLASH_SIZE
	ec300_flash_erase 0 $EC300_FLASH_SIZE
}

proc _ec300_write {file offset} {
	global EC300_BUF_ADDR EC300_BUF_SIZE EC300_PAGE_SIZE

	set size [file size $file]
	_ec300_check_range $offset $size

	if {$offset % $EC300_PAGE_SIZE} {
		error "The offset must be aligned to the page size"
	}

	set start [ms]
	set blank [lrepeat [expr {$EC300_PAGE_SIZE / 4}] 0xffffffff]

	echo [format "Programming %d bytes at 0x%06x" $size $offset]

	for {set win 0} {$win < $size} {incr win $EC300_BUF_SIZE} {
		set len [expr {$size - $win}]
		if {$len > $EC300_BUF_SIZE} {
			set len $EC300_BUF_SIZE
		}

		# Load this window of the file into OCRAM, padded with 0xff

		set nwords [expr {($len + $EC300_PAGE_SIZE - 1) / 4 & \
		                  ~($EC300_PAGE_SIZE / 4 - 1)}]
		write_memory $EC300_BUF_ADDR 32 [lrepeat $nwords 0xffffffff]
		load_image $file [expr {$EC300_BUF_ADDR - $win}] bin \
		           $EC300_BUF_ADDR $len

		for {set page 0} {$page < $len} {incr page $EC300_PAGE_SIZE} {
			set words [read_memory [expr {$EC300_BUF_ADDR + $page}] 32 \
			           [expr {$EC300_PAGE_SIZE / 4}]]

			if {$words ne $blank} {
				_nor_program_page [expr {$offset + $win + $page}] $words
			}
		}

		echo [format "  0x%06x / 0x%06x" [expr {$win + $len}] $size]
	}

	echo [format "Programmed %d bytes in %.1f s" $size \
	      [expr {([ms] - $start) / 1000.0}]]
}

proc ec300_flash_write {file {offset 0}} {
	ec300_flash_init
	_ec300_write $file $offset
	_flexspi_flush_ahb
}

# Compare the flash with a file.  This does not use verify_image, which runs
# a CRC algorithm on the CPU: the file is staged in OCRAM and both copies are
# read back through the debug port.

proc ec300_flash_verify {file {offset 0}} {
	global EC300_FLASH_BASE EC300_BUF_ADDR EC300_BUF_SIZE

	set size [file size $file]
	_ec300_check_range $offset $size

	ec300_flash_init
	_flexspi_flush_ahb

	for {set win 0} {$win < $size} {incr win $EC300_BUF_SIZE} {
		set len [expr {$size - $win}]
		if {$len > $EC300_BUF_SIZE} {
			set len $EC300_BUF_SIZE
		}

		# Compare whole words, the last one padded with 0xff

		set nwords [expr {($len + 3) / 4}]
		write_memory $EC300_BUF_ADDR 32 [lrepeat $nwords 0xffffffff]
		load_image $file [expr {$EC300_BUF_ADDR - $win}] bin \
		           $EC300_BUF_ADDR $len

		set expected [read_memory $EC300_BUF_ADDR 32 $nwords]
		set actual [read_memory \
		            [expr {$EC300_FLASH_BASE + $offset + $win}] 32 $nwords]

		if {$expected ne $actual} {
			for {set i 0} {$i < $nwords} {incr i} {
				if {[lindex $expected $i] != [lindex $actual $i]} {
					break
				}
			}

			error [format "Verify failed at 0x%06x: 0x%08x != 0x%08x" \
			       [expr {$offset + $win + $i * 4}] \
			       [lindex $actual $i] [lindex $expected $i]]
		}
	}

	echo [format "Verified %d bytes at 0x%06x" $size $offset]
}

proc ec300_flash_dump {file {offset 0} {length 0}} {
	global EC300_FLASH_BASE EC300_FLASH_SIZE

	if {$length == 0} {
		set length [expr {$EC300_FLASH_SIZE - $offset}]
	}

	_ec300_check_range $offset $length

	ec300_flash_init
	_flexspi_flush_ahb
	dump_image $file [expr {$EC300_FLASH_BASE + $offset}] $length
}

# Erase, program, verify and reboot

proc ec300_program {file {offset 0}} {
	ec300_flash_init
	_ec300_erase $offset [file size $file]
	_ec300_write $file $offset
	ec300_flash_verify $file $offset
	reset run
}

# The i.MX RT does not halt with SRST.  Without SRST, the HLA layer resets
# the chip with SYSRESETREQ, which reboots it through the boot ROM.

reset_config none
