config:
  cwd: './'

product:
  name: "ntfc-rv-virt64-kernel-smp"
  cores:
    core0:
      name: 'main'
      device: 'qemu'
      exec_path: 'qemu-system-riscv64'
      exec_args: '-semihosting -M virt,aclint=on -cpu rv64 -smp 4 -nographic'
      conf_path: './.config'
      elf_path: './nuttx'
      app_bindir: '../apps/bin'
      exec_cwd: './'
      boot_timeout: 15
