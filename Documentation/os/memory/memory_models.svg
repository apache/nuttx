<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400"
     font-family="Charter, Georgia, 'Times New Roman', serif" role="img"
     aria-label="The three memory models. A flat build has one heap shared by kernel and applications. A protected build splits it into a kernel heap and a user heap, separated by an MPU. A kernel build gives each process its own heap in its own virtual address space, provided by an MMU.">
  <style>
    .col   { fill: #f4f6fa; stroke: #c3cbd9; stroke-width: 1.2; }
    .ttl   { fill: #1b2233; font-size: 13.5px; font-weight: 600;
             font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace; }
    .cap   { fill: #5a6478; font-size: 11px; }
    .kheap { fill: #eef0fb; stroke: #3c34e3; stroke-width: 1.5; }
    .uheap { fill: #ffffff; stroke: #5a96bd; stroke-width: 1.4; }
    .both  { fill: #f7f7fd; stroke: #3c34e3; stroke-width: 1.5; }
    .t     { fill: #1b2233; font-size: 12.5px;
             font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace; }
    .s     { fill: #5a6478; font-size: 10.5px; }
    .bar   { stroke: #3c34e3; stroke-width: 2.4; stroke-dasharray: 7 4; }
    .barl  { fill: #3c34e3; font-size: 10.5px; font-style: italic; }
    .note  { fill: #5a6478; font-size: 11px; font-style: italic; }
  </style>

  <rect class="col" x="10" y="34" rx="9" width="282" height="322"/>
  <text class="ttl" x="26" y="22">FLAT</text>
  <text class="cap" x="26" y="56">one heap for everything</text>
  <rect class="both" x="26" y="72" rx="6" width="250" height="180"/>
  <text class="t" x="40" y="96">a single heap</text>
  <text class="s" x="40" y="114">kernel and application allocate</text>
  <text class="s" x="40" y="130">from the same pool</text>
  <text class="s" x="40" y="156">malloc() and kmm_malloc()</text>
  <text class="s" x="40" y="172">are the same allocator by default</text>
  <text class="note" x="26" y="288">Nothing separates them, so nothing</text>
  <text class="note" x="26" y="304">has to be copied at a boundary.</text>
  <text class="note" x="26" y="320">This is why flat is the smallest.</text>

  <rect class="col" x="308" y="34" rx="9" width="282" height="322"/>
  <text class="ttl" x="324" y="22">PROTECTED</text>
  <text class="cap" x="324" y="56">two heaps, one address space</text>
  <rect class="kheap" x="324" y="72" rx="6" width="250" height="76"/>
  <text class="t" x="338" y="96">kernel heap</text>
  <text class="s" x="338" y="114">kmm_malloc()</text>
  <text class="s" x="338" y="130">TCBs, driver state</text>
  <path class="bar" d="M 316 160 L 582 160"/>
  <rect x="424" y="150" width="52" height="20" fill="#f4f6fa"/>
  <text class="barl" x="450" y="164" text-anchor="middle">MPU</text>
  <rect class="uheap" x="324" y="172" rx="6" width="250" height="76"/>
  <text class="t" x="338" y="196">user heap</text>
  <text class="s" x="338" y="214">malloc()</text>
  <text class="s" x="338" y="230">everything the application owns</text>
  <text class="note" x="324" y="288">Addresses still mean the same thing</text>
  <text class="note" x="324" y="304">on both sides, so a pointer handed</text>
  <text class="note" x="324" y="320">across the boundary still works.</text>

  <rect class="col" x="606" y="34" rx="9" width="284" height="322"/>
  <text class="ttl" x="622" y="22">KERNEL</text>
  <text class="cap" x="622" y="56">one heap per process</text>
  <rect class="kheap" x="622" y="72" rx="6" width="252" height="60"/>
  <text class="t" x="636" y="94">kernel heap</text>
  <text class="s" x="636" y="112">one, shared by every process</text>
  <path class="bar" d="M 614 144 L 882 144"/>
  <rect x="722" y="134" width="52" height="20" fill="#f4f6fa"/>
  <text class="barl" x="748" y="148" text-anchor="middle">MMU</text>
  <rect class="uheap" x="622" y="156" rx="6" width="252" height="44"/>
  <text class="t" x="636" y="178">process A heap</text>
  <text class="s" x="636" y="194">its own virtual addresses</text>
  <rect class="uheap" x="622" y="208" rx="6" width="252" height="44"/>
  <text class="t" x="636" y="230">process B heap</text>
  <text class="s" x="636" y="246">its own virtual addresses</text>
  <text class="note" x="622" y="288">Two processes may hold the same</text>
  <text class="note" x="622" y="304">pointer value and mean different</text>
  <text class="note" x="622" y="320">memory.  The kernel translates.</text>
</svg>
